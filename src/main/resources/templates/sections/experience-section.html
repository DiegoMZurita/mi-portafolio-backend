<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<section id="experience" th:fragment="experience">
    <h2>MI EXPERIENCIA</h2>
    <div class="experience-timeline">
        <div class="timeline-item" th:each="exp: ${experienceList}">
            <h3 th:text="${exp.jobTitle} + ' - ' + ${exp.companyName}"></h3>
            <div class="date-range">
                <span th:text="${#strings.capitalize(#temporals.format(exp.startDate, 'MMMM yyyy'))}"></span>
                <span class="date-separator">→</span>
                <span th:text="${exp.endDate != null ? #strings.capitalize(#temporals.format(exp.endDate, 'MMMM yyyy')) : 'Actualidad'}"></span>
            </div>
            <p th:text="${exp.description}"></p>
        </div>
    </div>

</section>

</body>
</html>
