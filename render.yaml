services:
  - type: web
    name: mi-portafolio-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_SQL_INIT_MODE
        value: never
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: FILE_UPLOAD_DIR
        value: /tmp/portfolio-static/img/projects/
      - key: STATIC_FILES_DIR
        value: /tmp/portfolio-static/
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75.0
